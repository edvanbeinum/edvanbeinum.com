<div class="contents">
  <p>
    <a rel="full-article" title="{{ post.title }}" href="{{ root_url }}{{ post.url }}">{{ post.title }}</a>
    <span><time datetime="{{ post.date | datetime | date_to_xmlschema }}" pubdate>{{ post.date | date: "<span class='month'>%b</span> <span class='day'>%d</span> <span class='year'>%Y</span>"}}</time></span>
  </p>
</div>
